<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>DIKA - Giriş Yap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card shadow-sm border-0 p-4" style="width: 380px;">
    <h3 class="text-center mb-4 fw-bold">DIKA Portal Girişi</h3>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show mb-3" role="alert">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/login" method="POST">
        <div class="mb-3">
            <label class="form-label text-muted small fw-bold">E-POSTA</label>
            <input type="email" name="eposta" class="form-control" placeholder="Kurumsal E-posta Adresiniz" required>
        </div>
        <div class="mb-4">
            <label class="form-label text-muted small fw-bold">ŞİFRE</label>
            <input type="password" name="sifre" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Giriş Yap</button>
    </form>
</div>

</body>
</html>
